name: public-access-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Require real MCP SDK
        run: python -c "import mcp.server.fastmcp; import mcp.client.streamable_http"
      - run: python -m pytest -q
      - run: python -m compileall -q jachi jachibeopgyu_mcp.py
      - run: python -m jachi.cli demo --out output/demo
