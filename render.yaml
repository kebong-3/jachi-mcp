services:
  - type: web
    name: jachi-ordinance-review
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python jachibeopgyu_mcp.py --http
    healthCheckPath: /health
    envVars:
      - key: LAW_OC
        sync: false
      - key: MCP_API_TOKEN
        generateValue: true
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PUBLIC_READ_ONLY
        value: "false"
      - key: ALLOW_EXTERNAL_LLM
        value: "false"
